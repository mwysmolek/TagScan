name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - tagscan/**
      - assets/**
      - profiles/**
      - packaging/**
      - tests/**
      - requirements.txt
      - .github/workflows/build-windows.yml
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release v<version> (tag created if missing)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows-app:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -r requirements.txt -r packaging/requirements-build.txt

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = python packaging/build_exe.py --version
          "version=$v" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "tag $env:GITHUB_REF_NAME does not match tagscan.__version__ $v"
          }
          $tagged = git ls-remote --tags origin "refs/tags/v$v"
          "untagged=$([string]::IsNullOrWhiteSpace($tagged))".ToLower() >> $env:GITHUB_OUTPUT

      - name: Tests
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m pytest -q tests

      - name: Build app folder
        run: python packaging/build_exe.py

      - name: Smoke test (packaged app: synthetic photos -> OCR -> store -> export)
        shell: pwsh
        run: |
          $env:TAGSCAN_HOME = "$env:RUNNER_TEMP\tagscan"
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\tagscan\tagscan.exe" -ArgumentList "--smoke" -PassThru
          $finished = $p.WaitForExit(240000)
          if (-not $finished) { $p.Kill() }
          "---- log ----"; Get-Content "$env:TAGSCAN_HOME\smoke\tagscan.log" -Tail 40 -ErrorAction SilentlyContinue; "---- end ----"
          if (-not $finished) { throw "smoke test timed out" }
          if ($p.ExitCode -ne 0) { throw "smoke test failed with exit code $($p.ExitCode)" }
          if (-not (Select-String -Path "$env:TAGSCAN_HOME\smoke\tagscan.log" -Pattern "SMOKE OK" -Quiet)) { throw "no SMOKE OK in the log" }

      - name: Portable zip and checksums
        shell: pwsh
        run: |
          $zip = "dist\kayEi-TagScan-portable-${{ steps.ver.outputs.version }}.zip"
          $ProgressPreference = "SilentlyContinue"
          Compress-Archive -Path "dist\tagscan\*" -DestinationPath $zip
          $sums = Get-ChildItem dist -File -Filter *.zip | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          $sums | Set-Content "dist\SHA256SUMS.txt"
          Get-Content "dist\SHA256SUMS.txt"
          Get-ChildItem dist -File | ForEach-Object { '{0}: {1:N1} MB' -f $_.Name, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v4
        with:
          name: kayEi-TagScan-portable-${{ steps.ver.outputs.version }}
          path: |
            dist/kayEi-TagScan-portable-*.zip
            dist/SHA256SUMS.txt
          retention-days: 14

      - name: Publish release (version tag, a new version on main, or a manual run with 'release' ticked)
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && steps.ver.outputs.untagged == 'true') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: kayEi TagScan ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/kayEi-TagScan-portable-*.zip
            dist/SHA256SUMS.txt
